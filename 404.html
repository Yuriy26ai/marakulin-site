<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#131209">
<meta name="robots" content="noindex">
<title>Страница не найдена — Юрий Маракулин</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#131209;--text:#F2EFE8;--muted:rgba(242,239,232,0.64);--faint:rgba(242,239,232,0.40);--accent:#CDB892;--ease:cubic-bezier(0.22,1,0.36,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100dvh;display:flex;align-items:center}
  :focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
  main{max-width:680px;margin:0 auto;padding:64px 24px}
  .code{font-size:14px;line-height:20px;font-weight:600;color:var(--accent);letter-spacing:0.04em}
  h1{font-size:48px;line-height:1;font-weight:600;letter-spacing:-0.03em;margin-top:24px;padding-bottom:8px;text-wrap:balance;
    background:linear-gradient(90deg,#FFFFFF 0%,#9B9B9B 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:18px;line-height:28px;color:var(--muted);margin-top:24px;text-wrap:pretty}
  .row{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;margin-top:40px}
  .btn{display:inline-flex;padding:12px 24px;border-radius:999px;background:var(--accent);color:var(--bg);font-size:16px;line-height:24px;font-weight:600;text-decoration:none;
    transition:transform .5s var(--ease)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px) scale(0.98)}
  a.t{color:var(--text);font-size:16px;line-height:24px;font-weight:600;text-decoration:none;transition:color .3s var(--ease)}
  a.t:hover{color:var(--accent)}
  @media(max-width:720px){h1{font-size:36px;line-height:40px}}
</style>
</head>
<body>
<main>
  <p class="code">Ошибка 404</p>
  <h1>Такой страницы здесь нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Всё главное собрано на одной странице.</p>
  <div class="row">
    <a class="btn" href="/">На главную</a>
    <a class="t" href="/#contact">Обсудить задачу →</a>
  </div>
</main>
</body>
</html>
